# Manual releases only; ordinary pushes never create tags or publish RPMs.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the RPMs and keep them as the run's artifacts; no tag, no release"
        type: boolean
        default: true
      release_tag:
        description: "Optional existing vX.Y.Z tag to rebuild without creating or moving a tag"
        type: string
        default: ""

# One release at a time; a release in progress is never cancelled. GitHub keeps
# one waiting run per group: a newer one replaces it (docs/releasing.md). A
# dry run tags and publishes nothing, so it has a group of its own and never
# takes a waiting release's place.
concurrency:
  group: ${{ inputs.dry_run == false && 'release' || format('release-dry-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The Fedoras the packages are built for: one build each, the same commit
    # and the same version, told apart by the dist tag (.fc44, .fc45).
    strategy:
      fail-fast: true
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 120
    env:
      # Only an explicit manual publish from the default branch or an existing tag.
      RELEASE: >-
        ${{ inputs.dry_run == false &&
        (github.ref == 'refs/heads/onedrinux' || inputs.release_tag != '') }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CARGO_BUILD_JOBS: "1"
    # The same from every build of the matrix.
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # git before the checkout, so that it is a repository with its history
      # and tags.
      - name: Install the tools
        run: dnf -y install git rpm-build 'dnf-command(builddep)'

      - name: Check out, with every tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The container runs as root; the checkout belongs to the runner's user.
      - name: Set up the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select an existing release tag when requested
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            git show-ref --verify "refs/tags/$RELEASE_TAG"
            git checkout --detach "refs/tags/$RELEASE_TAG"
            test "v$(scripts/version.sh release)" = "$RELEASE_TAG"
          fi

      - name: Install the build dependencies
        run: |
          dnf -y builddep packaging/rpm/konedrive.spec
          printf '%%rustflags_debuginfo 0\n' >> "$HOME/.rpmmacros"

      - name: Say which compiler builds them
        run: rustc --version

      # A release is X.Y.Z, the version in Cargo.toml. A dry run takes a local
      # build's version, X.Y.Z~dev.N (N: the commit count of HEAD's history,
      # hence the full clone above), which sorts below the release: installed,
      # its RPMs do not stand in the way of the release's upgrade.
      - name: Choose the version
        id: version
        run: |
          if [ "$RELEASE" = true ]; then
            version=$(scripts/version.sh release)
            previous_tag=$(scripts/version.sh previous "$version")
            echo "Release $version (previous tag: ${previous_tag:-none})"
          else
            version=$(scripts/version.sh local)
            previous_tag=
            echo "Dry run: $version"
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "release=$RELEASE"
            echo "version=$version"
            echo "previous_tag=$previous_tag"
          } >>"$GITHUB_OUTPUT"

      - name: Build the RPMs
        run: |
          if [ "$RELEASE" = true ]; then
            scripts/build-rpm.sh --version "${{ steps.version.outputs.version }}"
          else
            scripts/build-rpm.sh
          fi

      - name: Collect the RPMs and their checksums
        run: |
          mkdir dist
          git rev-parse HEAD >dist/release-commit
          cp target/rpm/RPMS/*/*.rpm target/rpm/SRPMS/*.src.rpm dist/
          cd dist
          sha256sum -- *.rpm

      - name: Keep them as the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: konedrive-${{ steps.version.outputs.version }}-fc${{ matrix.fedora }}
          retention-days: 90
          path: dist/
          if-no-files-found: error

  # The packages a person would download, installed where nothing was built:
  # a missing dependency or a program that does not start stops the release
  # before anything is tagged.
  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        fedora: [44, 45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 30
    steps:
      - name: Fetch this Fedora's RPMs
        uses: actions/download-artifact@v8
        with:
          name: konedrive-${{ needs.build.outputs.version }}-fc${{ matrix.fedora }}
          path: dist

      # The daemon's package alone first, as a machine without Plasma has it;
      # dbus-daemon for the private bus below. It brings in nothing of Qt.
      - name: Install the daemon's package
        run: |
          rm -f dist/*.src.rpm
          ls -l dist
          dnf -y install dbus-daemon dist/konedrive-[0-9]*.rpm
          if rpm -q qt6-qtbase; then
            echo "::error::the konedrive package brought in Qt"
            exit 1
          fi

      - name: The daemon and the command line start
        run: |
          konedrived --version
          dbus-run-session -- konedrivectl --version

      # Then the window and the Dolphin plugins, as "sudo dnf install
      # ./konedrive-*.rpm" has them too.
      - name: Install the KDE package
        run: dnf -y install dist/konedrive-kde-*.rpm

      - name: The programs find their libraries
        run: |
          missing=0
          for file in /usr/bin/konedrived /usr/bin/konedrivectl \
                      $(rpm -ql konedrive-kde | grep -e '^/usr/bin/' -e '\.so$'); do
            echo "== $file"
            if ldd "$file" | grep 'not found'; then
              missing=1
            fi
          done
          exit "$missing"

      # The window, with no display, on a bus of its own: it must load its
      # QML and come up hidden, and is then stopped. "ready" is its last line
      # of a start (app/main.cpp).
      - name: The window starts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: konedrive.app.debug=true
          QT_FORCE_STDERR_LOGGING: "1"
          HOME: /tmp/home
          XDG_RUNTIME_DIR: /tmp/runtime
        run: |
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          dbus-run-session -- timeout 30 konedrive --background >window.log 2>&1
          rc=$?
          set -e
          cat window.log
          if ! grep -q 'ready, window hidden' window.log; then
            echo "::error::the window did not come up (exit $rc)"
            exit 1
          fi

  # Only a release (the build job's RELEASE).
  publish:
    needs: [build, install]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out the reviewed publisher
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the built source, keeping the reviewed publisher
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          mkdir -p target/ci
          cp scripts/ci/publish-release.py target/ci/publish-release.py
          git checkout --detach "$RELEASE_SHA"

      - name: Fetch both Fedora builds
        uses: actions/download-artifact@v8
        with:
          pattern: konedrive-${{ needs.build.outputs.version }}-fc*
          path: dist

      - name: Publish the verified RPMs
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 target/ci/publish-release.py
