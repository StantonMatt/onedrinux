# .github/workflows remains the inactive GitHub implementation.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Fork MRs run in the fork, never with this project's runners or token.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never

default:
  image: ubuntu:24.04
  tags: [ci-public]
  interruptible: true

variables:
  RUST_VERSION: "1.98.1"
  CARGO_INCREMENTAL: "0"
  dry_run:
    value: "true"
    options: ["true", "false"]
    description: "Build and install-check RPMs without tagging or publishing."
  release_tag:
    value: ""
    description: "Optional existing vX.Y.Z tag to rebuild; dry_run=false republishes it without moving/creating a tag."

stages: [check, test, release]

include:
  - local: .gitlab/ci/checks.yml

# Holding the resource group until the child finishes serializes the entire
# release, including both build/install matrices. Dry runs have their own lock.
release:
  stage: release
  interruptible: false
  resource_group: $RELEASE_GROUP
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $release_tag != "" && $dry_run == "false"'
      variables:
        RELEASE: "true"
        RELEASE_GROUP: release
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || (($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $dry_run == "false"))'
      variables:
        RELEASE: "true"
        RELEASE_GROUP: release
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
      variables:
        RELEASE: "false"
        RELEASE_GROUP: release-dry-$CI_COMMIT_REF_SLUG
  trigger:
    include: .gitlab/ci/release.yml
    strategy: depend
    forward:
      pipeline_variables: true
