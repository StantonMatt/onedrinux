.mr:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

structure:
  extends: .mr
  timeout: 5m
  before_script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends git
  script: scripts/check-structure.sh

.rust:
  image: rust:${RUST_VERSION}-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-ci
  cache:
    key:
      prefix: $CI_JOB_NAME-rust-$RUST_VERSION
      files: [Cargo.lock]
    paths: [.cargo-ci/registry/, .cargo-ci/git/, target/]
  before_script:
    - rustc --version

rustdoc:
  extends: [.mr, .rust]
  timeout: 30m
  variables:
    RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
  script: cargo doc --locked --workspace --no-deps --document-private-items

generated-texts:
  extends: [.mr, .rust]
  timeout: 30m
  script: cargo test -p konedrive-text --locked

.dev-mr:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"'

daemon:
  extends: [.dev-mr, .rust]
  timeout: 60m
  before_script:
    - rustc --version
    - apt-get update -q
    - apt-get install -y -q --no-install-recommends dbus-daemon util-linux
    - useradd --create-home tester
    - 'chown -R tester: "$CI_PROJECT_DIR"'
  script:
    - runuser -u tester -- cargo test --locked -p konedrived -p konedrive-graph -p konedrive-reason -p konedrive-tree --lib --features konedrived/dev-tools
    - runuser -u tester -- scripts/check-dead-code.sh

window:
  extends: .dev-mr
  image: fedora:45
  timeout: 60m
  before_script:
    - dnf -y install git dbus-daemon util-linux shadow-utils 'dnf-command(builddep)'
    - dnf -y builddep packaging/rpm/konedrive.spec
    - dnf -y install kf6-kirigami kf6-kirigami-addons kf6-kitemmodels kf6-kquickcharts kf6-qqc2-desktop-style qt6-qtdeclarative
    - useradd --create-home tester
    - 'chown -R tester: "$CI_PROJECT_DIR"'
  script:
    - |
      runuser -u tester -- sh -ec '
        cmake -S app -B build/app -DBUILD_TESTING=ON
        cmake --build build/app -j "$(nproc)"
        ctest --test-dir build/app --output-on-failure
        cmake -S dolphin -B build/dolphin -DBUILD_TESTING=ON
        cmake --build build/dolphin -j "$(nproc)"
        ctest --test-dir build/dolphin --output-on-failure
      '

release-script:
  extends: .mr
  image: python:3.13-bookworm
  timeout: 5m
  script: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
